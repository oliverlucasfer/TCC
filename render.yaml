services:
  - type: web
    name: prodocs
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: Jwt__TokenKey
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Render free tier tem limite de inotify por UID; polling evita o crash
      # "configured user limit (128) on the number of inotify instances"
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"
      - key: ConnectionStrings__Default
        value: Data Source=Api.db
      - key: Cors__AllowedOrigins__0
        value: https://prodocs.onrender.com
      - key: SeedAdminUser
        sync: false
      - key: SeedAdminPass
        sync: false
      - key: SeedAdminEmail
        sync: false
