<div class="page">
  <div class="pg-busca__header">
    <h1>Documentos</h1>
    <div class="pg-busca__actions">
      <button *ngIf="podeBackup" (click)="baixarBackup()" class="btn-edit btn-edit--ghost">
        <strong class="btn-edit__name">Backup</strong>
        <img class="btn-edit__icon" src="../../assets/icons/down.svg" alt="" />
      </button>
      <button *ngIf="podeEditar" (click)="redirectTo()" class="btn-edit">
        <strong class="btn-edit__name">Cadastrar Novo</strong>
        <img class="btn-edit__icon" src="../../assets/icons/edit.svg" alt="" />
      </button>
    </div>
  </div>
  <div class="pg-busca__search">
    <div class="pg-busca__search--icon">
      <img src="../../assets/icons/search.svg" alt="" />
    </div>
    <input
      class="pg-busca__search--input"
      type="text"
      placeholder="Buscar por título, autor ou conteúdo…"
      (input)="filtarDocumentos($event.target)"
    />
  </div>

  <!-- Skeletons de loading -->
  <div class="cards" *ngIf="carregando">
    <div class="card-doc" *ngFor="let s of [1, 2, 3, 4, 5, 6]">
      <div class="pd-skeleton card-doc__icon-skel"></div>
      <div class="pd-skeleton card-doc__linha-skel" style="width: 90%"></div>
      <div class="pd-skeleton card-doc__linha-skel" style="width: 60%"></div>
      <div class="card-doc__chips">
        <div class="pd-skeleton card-doc__chip-skel"></div>
        <div class="pd-skeleton card-doc__chip-skel"></div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div class="empty" *ngIf="!carregando && !documentos.length">
    <img src="../../assets/icons/search.svg" alt="" class="empty__icon" />
    <h3>Nenhum documento encontrado</h3>
    <p>Tente ajustar a busca ou navegue por uma categoria no menu lateral.</p>
    <button class="btn-edit" (click)="limpar()">Limpar filtros</button>
  </div>

  <!-- Grid de cards -->
  <div class="cards" *ngIf="!carregando && documentos.length">
    <div
      class="card-doc"
      *ngFor="let documento of documentos"
      (click)="info(documento.id)"
    >
      <div class="card-doc__top">
        <div class="card-doc__icon" [style.background]="corCategoria(documento.categoria)">
          PDF
        </div>
        <span class="pd-chip">{{ categorias[documento.categoria] }}</span>
      </div>
      <h3 class="card-doc__titulo" [title]="documento.titulo">{{ documento.titulo }}</h3>
      <p class="card-doc__autor">{{ documento.autor }}</p>
      <div class="card-doc__chips">
        <span class="pd-chip pd-chip--muted">{{ areas[documento.area] }}</span>
        <span class="pd-chip pd-chip--muted">{{ documento.ano }}</span>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-center" style="margin-top: 30px" *ngIf="!carregando && documentos.length">
    <pagination
      [boundaryLinks]="true"
      [totalItems]="pagination.totalItems"
      [itemsPerPage]="pagination.itemsPerPage"
      [(ngModel)]="pagination.currentPage"
      (pageChanged)="pageChanged($event)"
      pageBtnClass="btn"
      previousText="&lsaquo;"
      nextText="&rsaquo;"
      firstText="&laquo;"
      lastText="&raquo;"
    >
    </pagination>
  </div>

  <ng-template #template>
    <div class="modal__container filter-modal">
      <div class="filter-modal__header">
        <h3>Filtro</h3>
      </div>
      <div class="filter-modal__line">
        <h4>Área</h4>
        <select
          class="filter-modal__select-area"
          name="select-area"
          [(ngModel)]="filtroArea"
        >
          <option value="">Todas</option>
          <option *ngFor="let area of areas; let i = index" [value]="i.toString()">{{ area }}</option>
        </select>
      </div>
      <div class="filter-modal__line">
        <h4>Ano de Publicação</h4>
        <div class="date-filter">
          <select
            class="date-filter__select"
            name="select-date"
            [(ngModel)]="filtroAno"
          >
            <option value="">Todos</option>
            <option *ngFor="let a of anos" [value]="a.toString()">{{ a }}</option>
          </select>
        </div>
      </div>
      <div class="filter-modal__actions">
        <button
          class="filter-modal__button filter-modal__button--clean"
          (click)="limpar()"
        >
          Limpar
        </button>
        <button
          class="filter-modal__button filter-modal__button--apply"
          (click)="aplicar()"
        >
          Aplicar
        </button>
      </div>
    </div>
  </ng-template>
</div>
