<div class="page">
  <h2>Perfil</h2>
  <br />
  <form [formGroup]="form" (submit)="onSubmit()">
    <div class="pg-perfil">
      <div class="pg-perfil__info">
        <div>
          <label class="pg-perfil__info--label">Primeiro Nome</label>
          <input
            type="text"
            formControlName="primeiroNome"
            class="pg-perfil__info--data form-control"
          />
        </div>
        <div>
          <label class="pg-perfil__info--label">Último nome</label>
          <input
            type="text"
            formControlName="ultimoNome"
            class="pg-perfil__info--data form-control"
          />
        </div>
        <div>
          <label class="pg-perfil__info--label">E-mail</label>
          <input
            type="text"
            formControlName="email"
            class="pg-perfil__info--data form-control"
          />
        </div>
        <div>
          <label class="pg-perfil__info--label">Senha (deixe vazio para manter a atual)</label>
          <input
            type="password"
            formControlName="password"
            class="pg-perfil__info--data form-control"
          />
          <div class="invalid-feedback" *ngIf="f.password.dirty && f.password.errors?.minlength">
            A senha deve ter no mínimo 8 caracteres
          </div>
        </div>
        <div>
          <label class="pg-perfil__info--label">Confirmar Senha</label>
          <input
            type="password"
            formControlName="confirmePassword"
            class="pg-perfil__info--data form-control"
          />
        </div>
        <br />
        <div class="pg-perfil__info--btn-container">
          <button type="submit" class="pg-perfil__info--btn">Salvar Alterações</button>
        </div>
      </div>
    </div>
  </form>
</div>
