<div class="pg-home">
  <div class="pg-home__hero">
    <h1 class="pg-home__title">Encontre o seu documento aqui</h1>
    <p class="pg-home__sub">
      Busque, visualize e baixe TCCs, artigos, monografias, dissertações e teses
      com busca completa no conteúdo dos PDFs.
    </p>
    <div class="pg-home__action">
      <button (click)="redirectTo('lista')" class="pg-home__button pg-home__button--search">Buscar documentos</button>
      <button (click)="redirectTo('user/login')" class="pg-home__button pg-home__button--login">Entrar</button>
    </div>
  </div>

  <div class="pg-home__recentes" *ngIf="recentes.length">
    <div class="pg-home__recentes-header">
      <h3>Documentos recentes</h3>
      <a routerLink="/lista">Ver todos →</a>
    </div>
    <div class="pg-home__cards">
      <div class="card-doc" *ngFor="let doc of recentes" (click)="abrirDocumento(doc.id)">
        <div class="card-doc__top">
          <div class="card-doc__icon" [style.background]="corCategoria(doc.categoria)">PDF</div>
        </div>
        <h3 class="card-doc__titulo" [title]="doc.titulo">{{ doc.titulo }}</h3>
        <p class="card-doc__autor">{{ doc.autor }}</p>
      </div>
    </div>
  </div>
</div>
