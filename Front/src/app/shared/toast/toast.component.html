<div class="pd-toast-container">
  <div
    *ngFor="let toast of toasts"
    class="pd-toast"
    [class.pd-toast--success]="toast.type === 'success'"
    [class.pd-toast--danger]="toast.type === 'danger'"
    [class.pd-toast--warning]="toast.type === 'warning'"
    [class.pd-toast--info]="toast.type === 'info'"
  >
    <span class="pd-toast__icon">
      {{ toast.type === 'success' ? '✓' : toast.type === 'danger' ? '✕' : toast.type === 'warning' ? '!' : 'i' }}
    </span>
    <span class="pd-toast__msg">{{ toast.message }}</span>
    <button type="button" class="pd-toast__close" (click)="dismiss(toast.id)" aria-label="Fechar">×</button>
  </div>
</div>
