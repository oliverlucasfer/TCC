<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100">
  <div *ngFor="let toast of toasts" class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header" [class.bg-danger]="toast.type === 'danger'" [class.bg-success]="toast.type === 'success'" [class.bg-warning]="toast.type === 'warning'" [class.text-white]="toast.type === 'danger' || toast.type === 'success'">
      <strong class="me-auto">ProDocs</strong>
      <button type="button" class="btn-close" (click)="dismiss(toast.id)"></button>
    </div>
    <div class="toast-body text-dark">{{ toast.message }}</div>
  </div>
</div>
