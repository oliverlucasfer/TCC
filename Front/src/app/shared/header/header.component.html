<header class="header" [class.header--scrolled]="rolou">
  <div class="header__container">
    <button class="header__hamburger" type="button" aria-label="Abrir menu" (click)="ui.toggleMenu()">
      <span></span><span></span><span></span>
    </button>

    <a class="header__brand" href="/" aria-label="ProDocs — início">
      <svg class="header__logo" viewBox="0 0 132 30" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ProDocs">
        <rect x="1" y="2" width="20" height="26" rx="3.5" class="logo-doc"/>
        <rect x="4.5" y="9" width="13" height="2.4" rx="1.2" fill="#fff"/>
        <rect x="4.5" y="14" width="13" height="2.4" rx="1.2" fill="#fff"/>
        <rect x="4.5" y="19" width="8.5" height="2.4" rx="1.2" fill="#fff"/>
        <text x="28" y="21.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="-0.5" fill="currentColor">ProDocs</text>
      </svg>
    </a>

    <div class="header__actions">
      <button
        class="header__theme"
        type="button"
        (click)="toggleTema($event)"
        [attr.aria-label]="theme.isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'"
        [title]="theme.isDark() ? 'Tema claro' : 'Tema escuro'"
      >
        <svg *ngIf="!theme.isDark()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg *ngIf="theme.isDark()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>

      <div *ngIf="user; else botaoLogin" class="userinfo" (click)="toggleMenu($event)">
        <div class="userinfo__avatar">
          {{ iniciais }}
        </div>
        <span class="userinfo__username">{{ primeiroNome }}</span>
        <svg class="userinfo__caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="m6 9 6 6 6-6"/>
        </svg>

        <div class="userinfo__menu" *ngIf="menuAberto" (click)="$event.stopPropagation()">
          <button type="button" (click)="redirectTo()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>
            </svg>
            Perfil
          </button>
          <button type="button" class="userinfo__menu--logout" (click)="logout()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
            Sair
          </button>
        </div>
      </div>

      <ng-template #botaoLogin>
        <a class="header__login" routerLink="/user/login">Entrar</a>
      </ng-template>
    </div>
  </div>
</header>
